<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - CineSphere</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="app-wrapper">
    <div class="ambient-glow"></div>

    <header class="navbar">
      <div class="navbar-container">
        <a href="index.html" class="brand-logo" aria-label="CineSphere Home">
          <div class="brand-logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
          </div>
          <span class="brand-logo-text">Cine<span>Sphere</span></span>
        </a>

        <div class="navbar-actions">
          <button type="button" class="theme-toggle-btn" aria-label="Toggle Theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="auth-page-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-icon-badge">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <h1 class="auth-title">Reset Password</h1>
          <p class="auth-desc">Enter your email and we'll send you password recovery instructions</p>
        </div>

        <div id="forgot-alert" class="auth-alert" role="alert"></div>

        <form id="forgot-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="forgot-email" class="form-label">Email Address</label>
            <div class="form-input-wrap">
              <div class="form-input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/>
                </svg>
              </div>
              <input
                type="email"
                id="forgot-email"
                class="form-input"
                placeholder="you@example.com"
                required
                autocomplete="email"
              />
            </div>
          </div>

          <button type="submit" id="forgot-submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
            Send Reset Instructions
          </button>
        </form>

        <div id="simulated-link-box" style="display: none;"></div>

        <div class="auth-footer">
          Remember your password? <a href="login.html" class="auth-link">Sign In</a>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
