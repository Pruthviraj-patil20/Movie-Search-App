<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - CineSphere</title>
  <meta name="description" content="Sign in to your CineSphere account to access your personalized dashboard, watchlist, and favorites." />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="app-wrapper">
    <div class="ambient-glow"></div>

    <!-- Header Navbar -->
    <header class="navbar">
      <div class="navbar-container">
        <a href="index.html" class="brand-logo" aria-label="CineSphere Home">
          <div class="brand-logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
          </div>
          <span class="brand-logo-text">Cine<span>Sphere</span></span>
        </a>

        <div class="navbar-actions">
          <button type="button" class="theme-toggle-btn" aria-label="Toggle Theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="auth-page-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-icon-badge">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
          </div>
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-desc">Sign in to your CineSphere account to continue</p>
        </div>

        <div id="login-alert" class="auth-alert" role="alert"></div>

        <form id="login-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="login-email" class="form-label">Email Address</label>
            <div class="form-input-wrap">
              <div class="form-input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/>
                </svg>
              </div>
              <input
                type="email"
                id="login-email"
                class="form-input"
                placeholder="you@example.com"
                required
                autocomplete="email"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="login-password" class="form-label">Password</label>
            <div class="form-input-wrap">
              <div class="form-input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </div>
              <input
                type="password"
                id="login-password"
                class="form-input"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
              <button type="button" id="login-toggle-password" class="password-toggle-btn" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-options-row">
            <label class="checkbox-label">
              <input type="checkbox" id="login-remember" class="checkbox-input" />
              <span>Remember me for 30 days</span>
            </label>
            <a href="forgot-password.html" class="auth-link">Forgot password?</a>
          </div>

          <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
            Sign In
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account yet? <a href="signup.html" class="auth-link">Create an account</a>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
