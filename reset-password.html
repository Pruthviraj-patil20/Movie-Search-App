<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password - CineSphere</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="app-wrapper">
    <div class="ambient-glow"></div>

    <header class="navbar">
      <div class="navbar-container">
        <a href="index.html" class="brand-logo" aria-label="CineSphere Home">
          <div class="brand-logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
          </div>
          <span class="brand-logo-text">Cine<span>Sphere</span></span>
        </a>

        <div class="navbar-actions">
          <button type="button" class="theme-toggle-btn" aria-label="Toggle Theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="auth-page-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-icon-badge">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <h1 class="auth-title">Create New Password</h1>
          <p class="auth-desc">Choose a strong, secure password for your account</p>
        </div>

        <div id="reset-alert" class="auth-alert" role="alert"></div>

        <form id="reset-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="reset-password" class="form-label">New Password</label>
            <div class="form-input-wrap">
              <div class="form-input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </div>
              <input
                type="password"
                id="reset-password"
                class="form-input"
                placeholder="Minimum 8 characters"
                required
                autocomplete="new-password"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="reset-confirm-password" class="form-label">Confirm New Password</label>
            <div class="form-input-wrap">
              <div class="form-input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
              </div>
              <input
                type="password"
                id="reset-confirm-password"
                class="form-input"
                placeholder="••••••••"
                required
                autocomplete="new-password"
              />
            </div>
          </div>

          <button type="submit" id="reset-submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
            Set New Password
          </button>
        </form>

        <div class="auth-footer">
          <a href="login.html" class="auth-link">Back to Sign In</a>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
